name: Bug report
description: Something in The City doesn't work as it should.
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Rough notes are fine, and a screenshot or screen recording helps a lot.
        Security problems go through the **Security** tab instead (see [SECURITY.md](https://github.com/Slaymish/theCity/blob/main/SECURITY.md)).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, and what you expected to see instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project with …
        2. Ask Reception to …
        3. …
  - type: input
    id: app-version
    attributes:
      label: The City version
      description: The City › About The City
      placeholder: "0.1.1"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "26.1"
  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
      description: Output of `claude --version`
      placeholder: "2.1.163"
  - type: textarea
    id: log
    attributes:
      label: Raw log (optional)
      description: View › Show Raw Log (⌥⌘L). Check it for anything private before pasting.
      render: text
