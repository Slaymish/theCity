name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lukiyanov/setup-xcode@v1
        with:
          xcode-version: "27"
      - run: brew install xcodegen
      - name: Unit tests
        run: make test
      - name: Build app
        run: |
          make project
          xcodebuild -project TheCity.xcodeproj -scheme TheCity -configuration Debug \
            -destination 'generic/platform=macOS' -derivedDataPath build -quiet build

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lukiyanov/setup-xcode@v1
        with:
          xcode-version: "27"
      - run: brew install xcodegen
      - name: Build release
        run: |
          make project
          xcodebuild -project TheCity.xcodeproj -scheme TheCity -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build -quiet \
            MARKETING_VERSION="${GITHUB_REF_NAME#v}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" build
      - name: Package
        run: |
          APP=build/Build/Products/Release/TheCity.app
          mkdir -p dist dmg
          ditto -c -k --keepParent "$APP" "dist/TheCity-$GITHUB_REF_NAME.zip"
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "The City" -srcfolder dmg -format UDZO "dist/TheCity-$GITHUB_REF_NAME.dmg"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="## $VERSION" '$0 == v { found = 1; next } found && /^## / { exit } found' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then NOTES=(--notes-file notes.md); else NOTES=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "The City $VERSION" "${NOTES[@]}"
