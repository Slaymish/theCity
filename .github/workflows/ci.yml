name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - name: Unit tests
        run: make test
      - name: Build app
        run: |
          make project
          xcodebuild -project TheCity.xcodeproj -scheme TheCity -configuration Debug \
            -destination 'generic/platform=macOS' -derivedDataPath build -quiet build
      - name: Build iPhone app
        run: make companion

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - name: Build release
        run: |
          make project
          xcodebuild -project TheCity.xcodeproj -scheme TheCity -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build -quiet \
            MARKETING_VERSION="${GITHUB_REF_NAME#v}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" build
      - name: Package
        run: |
          APP=build/Build/Products/Release/TheCity.app
          mkdir -p dist dmg
          ditto -c -k --keepParent "$APP" "dist/TheCity-$GITHUB_REF_NAME.zip"
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "The City" -srcfolder dmg -format UDZO "dist/TheCity-$GITHUB_REF_NAME.dmg"
          awk -v v="## ${GITHUB_REF_NAME#v}" '$0 == v { found = 1; next } found && /^## / { exit } found' CHANGELOG.md > notes.md
      - name: Sign update and write appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_ED_PRIVATE_KEY" || { echo "::error::SPARKLE_ED_PRIVATE_KEY secret is not set"; exit 1; }
          mkdir appcast
          cp "dist/TheCity-$GITHUB_REF_NAME.zip" appcast/
          if [ -s notes.md ]; then cp notes.md "appcast/TheCity-$GITHUB_REF_NAME.md"; fi
          echo "$SPARKLE_ED_PRIVATE_KEY" | build/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast --ed-key-file - --embed-release-notes \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" \
            --link "https://github.com/$GITHUB_REPOSITORY" -o dist/appcast.xml appcast
          grep -q 'sparkle:edSignature=' dist/appcast.xml || { echo "::error::appcast update is not EdDSA-signed"; exit 1; }
          grep -q 'sparkle-signatures:' dist/appcast.xml || { echo "::error::appcast feed is not signed"; exit 1; }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s notes.md ]; then NOTES=(--notes-file notes.md); else NOTES=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "The City ${GITHUB_REF_NAME#v}" "${NOTES[@]}"
