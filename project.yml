name: TheCity
options:
  bundleIdPrefix: nz.hamish
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  OfficeCore:
    path: Packages/OfficeCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
targets:
  TheCity:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["Brands/**"]
      - path: App/Brands
        type: folder
        buildPhase: resources
      - path: fixtures/three-rooms.jsonl
        buildPhase: resources
      - path: SampleWorkspace
        type: folder
        buildPhase: resources
    dependencies:
      - package: OfficeCore
      - package: Sparkle
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: The City
        CFBundleName: The City
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        SUFeedURL: https://github.com/Slaymish/theCity/releases/latest/download/appcast.xml
        SUPublicEDKey: XFsMrfnVINrYuvdLOzPgPXbDhfGGm+Uu6fYmTaGAkxQ=
        SUEnableAutomaticChecks: true
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nz.hamish.thecity
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
schemes:
  TheCity:
    build:
      targets:
        TheCity: all
